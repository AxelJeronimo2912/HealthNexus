<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141739">
<title>Sin conexión · HealthNexus</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
         background: #0D1230; color: #FFFFFF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .logo { width: 72px; height: 72px; border-radius: 18px; background: #FFFFFF; display: grid; place-items: center; }
  .logo img { width: 56px; height: 56px; object-fit: contain; }
  h1 { margin: 8px 0 0; font-size: 26px; }
  p { margin: 0; font-size: 16px; line-height: 1.6; color: #C9CDF0; }
  button { margin-top: 8px; height: 48px; padding: 0 28px; border: none; border-radius: 12px; background: #5B5FEF; color: #FFFFFF;
           font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:hover { background: #4A4ED8; }
  small { color: #9EA3F7; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="logo"><img src="/images/logo-mark.png" alt=""></div>
  <h1>Sin conexión</h1>
  <p>No pudimos conectar con HealthNexus. Revisa tu conexión a internet e inténtalo de nuevo.</p>
  <p>Por seguridad, la información de pacientes no se guarda en este dispositivo y solo está disponible en línea.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
  <small>HealthNexus · by NEXARA</small>
</main>
</body>
</html>
